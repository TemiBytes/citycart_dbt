models:
  - name: stg_products
    description: "Cleansed product catalog from RAW_APP.PRODUCTS"
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique
      - name: standard_price
        data_tests:
          - not_null
      - name: cost_price
        data_tests:
          - not_null