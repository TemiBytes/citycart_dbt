models:
  - name: stg_orders
    description: 'Cleansed orders from RAW_APP.ORDERS'
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: total_amount
        data_tests:
          - not_null